# Construye un APK de prueba y lo prueba en un emulador de Android con Maestro.
# Se corre solo al subir cambios (pestaña Actions del repositorio) o a mano (Run workflow).
name: APK

on:
  push:
    branches: [main, 'claude/**']
    # No gastar minutos cuando solo cambian documentos o la segunda app.
    paths-ignore: ['**.md', 'proyectos/**', '.github/workflows/apk-asesor-prompts.yml']
  pull_request:
    paths-ignore: ['**.md', 'proyectos/**', '.github/workflows/apk-asesor-prompts.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Maestro: versión fija y huella SHA-256 del archivo, tomada el 2026-11-04.
  # Maestro no publica una huella oficial: si cambias la versión, calcula la nueva
  # con `sha256sum maestro.zip` y revisa que el archivo venga de la página oficial.
  MAESTRO_VERSION: "2.12.1"
  MAESTRO_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"

jobs:
  construir:
    name: Construir APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Copiar la web al proyecto de Android
        run: npx cap sync android
      - name: Aceptar las licencias del SDK de Android (autorizado por el dueño del repositorio)
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          fi
      - name: Construir el APK (variante debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  probar:
    name: Probar en emulador (Maestro)
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          name: apk-debug
          path: apk
      - name: Instalar Maestro (versión fija, con comprobación)
        run: |
          curl -sSfL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum --check
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Activar KVM (emulador rápido)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador, instalar el APK y correr las pruebas
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        with:
          api-level: 34
          arch: x86_64
          # Imagen "default" (sin Google Play Services): en un emulador lento, los Play Services
          # se bloqueaban y Android cerraba la app (se vio en la primera prueba).
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb install apk/app-debug.apk
            maestro test --format junit --output informe-maestro.xml .maestro/
      - name: Guardar el informe y las capturas de Maestro
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-maestro
          path: |
            informe-maestro.xml
            ~/.maestro/tests/
          if-no-files-found: warn
